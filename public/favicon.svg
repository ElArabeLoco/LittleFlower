<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Florecita small-size mark: the FlowerMark petals without stamens and with
       a larger heart, so it still reads at 16px. The petal edge follows the
       browser's color scheme so it separates petals on light and dark tabs. -->
  <defs>
    <radialGradient id="petal" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="54">
      <stop offset="0" stop-color="#951B48"/>
      <stop offset="0.4" stop-color="#E8538C"/>
      <stop offset="1" stop-color="#FCA8C7"/>
    </radialGradient>
  </defs>
  <style>
    .edge { stroke: #FFFFFF; }
    .heart { fill: #6859CE; }
    @media (prefers-color-scheme: dark) {
      .edge { stroke: #181015; }
      .heart { fill: #9A8FF4; }
    }
  </style>
  <g transform="translate(60 61) scale(1.1)">
    <g class="edge" fill="url(#petal)" stroke-width="4" stroke-linejoin="round">
      <path d="M0 0C-10-8-22-24-22-38C-22-48-15-54-8-53C-5-52.5-2-51 0-48C2-51 5-52.5 8-53C15-54 22-48 22-38C22-24 10-8 0 0Z"/>
      <path transform="rotate(72)" d="M0 0C-10-8-22-24-22-38C-22-48-15-54-8-53C-5-52.5-2-51 0-48C2-51 5-52.5 8-53C15-54 22-48 22-38C22-24 10-8 0 0Z"/>
      <path transform="rotate(144)" d="M0 0C-10-8-22-24-22-38C-22-48-15-54-8-53C-5-52.5-2-51 0-48C2-51 5-52.5 8-53C15-54 22-48 22-38C22-24 10-8 0 0Z"/>
      <path transform="rotate(216)" d="M0 0C-10-8-22-24-22-38C-22-48-15-54-8-53C-5-52.5-2-51 0-48C2-51 5-52.5 8-53C15-54 22-48 22-38C22-24 10-8 0 0Z"/>
      <path transform="rotate(288)" d="M0 0C-10-8-22-24-22-38C-22-48-15-54-8-53C-5-52.5-2-51 0-48C2-51 5-52.5 8-53C15-54 22-48 22-38C22-24 10-8 0 0Z"/>
    </g>
    <circle class="heart" r="11"/>
  </g>
</svg>
