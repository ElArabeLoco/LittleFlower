<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Flower petals -->
  <g transform="translate(256,240)">
    <!-- 5 petals arranged in a circle -->
    <ellipse cx="0" cy="-70" rx="42" ry="70" fill="#f472b6" opacity="0.85" transform="rotate(0)"/>
    <ellipse cx="0" cy="-70" rx="42" ry="70" fill="#e879f9" opacity="0.8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-70" rx="42" ry="70" fill="#f472b6" opacity="0.85" transform="rotate(144)"/>
    <ellipse cx="0" cy="-70" rx="42" ry="70" fill="#e879f9" opacity="0.8" transform="rotate(216)"/>
    <ellipse cx="0" cy="-70" rx="42" ry="70" fill="#f472b6" opacity="0.85" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="28" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="18" fill="#f59e0b"/>
  </g>
  <!-- Stem -->
  <path d="M256 290 Q256 360 250 410 Q248 430 256 440" stroke="#4ade80" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M253 350 Q220 330 210 360 Q225 365 253 350Z" fill="#4ade80"/>
  <path d="M258 380 Q290 360 300 390 Q285 395 258 380Z" fill="#4ade80"/>
</svg>
