<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="petal3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </radialGradient>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="108%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- Five sakura-style petals with heart-shaped tips -->
  <g transform="translate(256,248)">
    <!-- Petal 1 — top -->
    <path d="M0,-30 C-28,-80 -50,-140 -18,-170 C-4,-182 4,-182 18,-170 C50,-140 28,-80 0,-30Z" fill="url(#petal1)" transform="rotate(0)"/>
    <!-- Petal 2 -->
    <path d="M0,-30 C-28,-80 -50,-140 -18,-170 C-4,-182 4,-182 18,-170 C50,-140 28,-80 0,-30Z" fill="url(#petal2)" transform="rotate(72)"/>
    <!-- Petal 3 -->
    <path d="M0,-30 C-28,-80 -50,-140 -18,-170 C-4,-182 4,-182 18,-170 C50,-140 28,-80 0,-30Z" fill="url(#petal3)" transform="rotate(144)"/>
    <!-- Petal 4 -->
    <path d="M0,-30 C-28,-80 -50,-140 -18,-170 C-4,-182 4,-182 18,-170 C50,-140 28,-80 0,-30Z" fill="url(#petal1)" transform="rotate(216)"/>
    <!-- Petal 5 -->
    <path d="M0,-30 C-28,-80 -50,-140 -18,-170 C-4,-182 4,-182 18,-170 C50,-140 28,-80 0,-30Z" fill="url(#petal2)" transform="rotate(288)"/>
    <!-- Inner petal highlights -->
    <path d="M0,-28 C-16,-60 -28,-100 -10,-120 C-2,-128 2,-128 10,-120 C28,-100 16,-60 0,-28Z" fill="white" opacity="0.2" transform="rotate(0)"/>
    <path d="M0,-28 C-16,-60 -28,-100 -10,-120 C-2,-128 2,-128 10,-120 C28,-100 16,-60 0,-28Z" fill="white" opacity="0.15" transform="rotate(72)"/>
    <path d="M0,-28 C-16,-60 -28,-100 -10,-120 C-2,-128 2,-128 10,-120 C28,-100 16,-60 0,-28Z" fill="white" opacity="0.2" transform="rotate(144)"/>
    <path d="M0,-28 C-16,-60 -28,-100 -10,-120 C-2,-128 2,-128 10,-120 C28,-100 16,-60 0,-28Z" fill="white" opacity="0.15" transform="rotate(216)"/>
    <path d="M0,-28 C-16,-60 -28,-100 -10,-120 C-2,-128 2,-128 10,-120 C28,-100 16,-60 0,-28Z" fill="white" opacity="0.2" transform="rotate(288)"/>
    <!-- Center dot cluster -->
    <circle cx="0" cy="0" r="24" fill="url(#center)"/>
    <circle cx="-7" cy="-8" r="4" fill="#fbbf24" opacity="0.7"/>
    <circle cx="8" cy="-6" r="3.5" fill="#fbbf24" opacity="0.6"/>
    <circle cx="0" cy="8" r="3" fill="#fbbf24" opacity="0.5"/>
    <circle cx="-9" cy="4" r="2.5" fill="#fde68a" opacity="0.5"/>
    <circle cx="9" cy="5" r="2.5" fill="#fde68a" opacity="0.5"/>
  </g>
</svg>
